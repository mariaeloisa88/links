
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Find all my professional links, writing, shop, and projects.">
  <title>My Links</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 48px 20px;
      min-height: 100vh;
      font-family: system-ui, sans-serif;
      background: #f5f3ef;
      color: #292820;
      display: flex;
      justify-content: center;
    }

    main {
      width: 100%;
      max-width: 520px;
      text-align: center;
    }

    .eyebrow {
      font-size: .8rem;
      letter-spacing: .15em;
      text-transform: uppercase;
      color: #706d62;
    }

    h1 {
      font-size: 2.3rem;
      margin: 12px 0;
    }

    .intro {
      color: #625f56;
      line-height: 1.7;
      margin-bottom: 32px;
    }

    nav {
      display: grid;
      gap: 12px;
    }

    nav a {
      display: block;
      padding: 17px 20px;
      border: 1px solid #d7d2c8;
      border-radius: 12px;
      background: #fffefa;
      color: #292820;
      text-decoration: none;
      font-weight: 600;
      transition: background .15s, transform .15s;
    }

    nav a:hover {
      background: #e9e4d9;
      transform: translateY(-2px);
    }

    nav a:focus-visible {
      outline: 3px solid #6655aa;
      outline-offset: 3px;
    }

    footer {
      margin-top: 36px;
      color: #706d62;
      font-size: .85rem;
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">One place, all my links</p>
    <h1>Maria Eloisa Pedro</h1>
    <p class="intro">
      Welcome! Find my professional profile,
      writing, shop, and projects below.
    </p>

    <nav aria-label="My online destinations">
      <a href="https://www.linkedin.com/in/mariaeloisa/"
         target="_blank" rel="noopener noreferrer">
        LinkedIn
      </a>

      <a href="https://medium.com/@mariaeloisa.088"
         target="_blank" rel="noopener noreferrer">
        My Blog
      </a>

      <a href="https://ko-fi.com/mariaeloisapedro/shop"
         target="_blank" rel="noopener noreferrer">
        My Ko-fi Shop
      </a>

      <a href="https://github.com/mariaeloisa88"
         target="_blank" rel="noopener noreferrer">
        GitHub
      </a>
    </nav>

    <footer>
      Thanks for stopping by. Follow me!
    </footer>
  </main>
</body>
</html>
